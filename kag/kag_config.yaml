#------------project configuration start----------------#
# Trich xuat thuc the / quan he tu van ban luat. ~2700 luot goi cho ca kho, nen
# do tre moi luot quan trong hon chat luong tung cau tra loi. Do tren chunk that
# 4000 ky tu: deepseek-v4.1-flash 12.4s, gemini/gemini-3.7-flash 7.0s,
# cx/gpt-5.5 253.9s, cx/gpt-5.6-terra(max) 302.8s -> timeout.
# Hai model cx bi gateway cat o 524, va llm_client.py invoke(with_except=False)
# nuot loi im lang -> chunk mat sach thuc the ma van bao thanh cong.
# Dung dat model thinking-max o day.
openie_llm: &openie_llm
  type: maas
  base_url: https://hermesgate.app/v1
  api_key: sk-8Ic0ZMDSAofRdBxGeHPk7g9LrhZJWRogRZDoxG8N2VySwVCV
  model: deepseek-v4.1-flash
  enable_check: false
  # Khong co dong nay thi OpenAIClient khong truyen timeout xuong, roi ve mac dinh
  # 600s cua SDK -> mot request treo dung ca run 2700 luot. Do that 12.4s/luot nen
  # 90s da rat rong; request chet thi bung ra ngay thay vi dung 10 phut.
  timeout: 90

chat_llm: &chat_llm
  type: maas
  base_url: https://hermesgate.app/v1
  api_key: sk-8Ic0ZMDSAofRdBxGeHPk7g9LrhZJWRogRZDoxG8N2VySwVCV
  model: deepseek-v4.1-flash
  enable_check: false
  # Rong hon openie vi cau tra loi dai hon nhieu.
  timeout: 120

vectorize_model: &vectorize_model
  api_key: sk-e3e919889952f476-b6ygfb-d5193aa0
  base_url: https://rx7m9q2.abc-tunnel.us/v1
  # Gateway dinh tuyen theo dang provider/model. Doi model thi phai doi ca
  # vector_dimensions cho khop, va phai reset lai index cu trong OpenSPG.
  model: gemini/gemini-embedding-001
  type: openai
  vector_dimensions: 3072
  enable_check: false
  # OpenAIVectorizeModel CO truyen timeout xuong client, nhung bo trong = vo han.
  timeout: 60
vectorizer: *vectorize_model

log:
  level: INFO

project:
  # Tiền tố tra prompt. init_prompt_with_fallback thử "{biz_scene}_{tên}" trước,
  # lỗi mới rơi về "default_{tên}". Đây là đường DUY NHẤT để thay prompt sinh câu
  # trả lời khi enable_ref: true, xem kag/solver/prompt/refer_generator.py.
  # Đổi lại thành default là quay về prompt tiếng Anh của KAG, im lặng, không báo
  # lỗi. Prompt nào chưa viết bản legal_ thì tự rơi về default, không gãy.
  biz_scene: legal
  host_addr: http://127.0.0.1:8887
  id: '1'
  language: en
  namespace: Legal
#------------project configuration end----------------#

#------------metadata injection configuration start----------------#
# Nạp 25 file data/metadata vào đồ thị dưới dạng node LegalDocument + cạnh
# thay thế / sửa đổi / hướng dẫn thi hành. Scanner của builder chỉ nhận .md
# nên đây là đường duy nhất để ngày hiệu lực và chuỗi thay thế vào được graph.
# Sinh file trước bằng: python builder/metadata_to_graph.py (đứng ở thư mục kag/)
#
# Đường dẫn tính theo CWD chứ không theo vị trí file config, vì
# DefaultExternalGraphLoader.from_json_file gọi thẳng open(node_file_path).
# Cả ba lệnh metadata_to_graph / injection / indexer đều chạy ở kag/ nên ../data
# là đúng. Đổi chỗ đứng thì phải đổi hai dòng dưới.
external_graph_loader: &external_graph_loader
  type: legal_external_graph # kag/builder/external_graph.py
  node_file_path: ../data/graph/nodes.json
  edge_file_path: ../data/graph/edges.json
  match_config:
    k: 1
    threshold: 0.9

metadata_inject_chain:
  type: domain_kg_inject_chain # kag.builder.default_chain.DomainKnowledgeInjectChain
  external_graph: *external_graph_loader
  vectorizer:
    type: batch_vectorizer # kag.builder.component.vectorizer.batch_vectorizer.BatchVectorizer
    vectorize_model: *vectorize_model
  writer:
    type: kg_writer # kag.builder.component.writer.kg_writer.KGWriter
#------------metadata injection configuration end----------------#

#------------kag-builder configuration start----------------#
kag_builder_pipeline:
  chain:
    type: unstructured_builder_chain # kag.builder.default_chain.DefaultUnstructuredBuilderChain
    extractor:
      type: schema_free_extractor # kag.builder.component.extractor.schema_free_extractor.SchemaFreeExtractor
      llm: *openie_llm
      ner_prompt:
        type: legal_ner # kag/builder/prompt/ner.py
      std_prompt:
        type: legal_std # kag/builder/prompt/std.py
      triple_prompt:
        type: legal_triple # kag/builder/prompt/triple.py
      # Cho extractor biết trước danh sách văn bản: schema_free_extractor.py:120
      # gọi external_graph.ner(passage) để vớt thực thể LLM bỏ sót.
      external_graph: *external_graph_loader
    reader:
      type: md_reader # kag.builder.component.reader.markdown_reader.MarkDownReader
      # cắt một chunk = một Điều. Heading Điều nằm ở mức h4 trong data/processed,
      # mặc định 3 sẽ cắt ở mức Mục và gộp nhiều Điều vào chung một chunk.
      cut_depth: 4
    post_processor:
      type: kag_post_processor # kag.builder.component.postprocessor.kag_postprocessor.KAGPostProcessor
      external_graph: *external_graph_loader
      # BẮT BUỘC phải có. kag_postprocessor.py:187 là
      #     if self.similarity_threshold is not None:
      # bao trùm CẢ similarity_based_link LẪN external_graph_based_link. Bỏ trống
      # thì cả hai bước nối thực thể đều bị bỏ qua, dù đã khai external_graph.
      # Ví dụ domain_kg của KAG cũng thiếu dòng này nên chính nó cũng không nối.
      similarity_threshold: 0.9
    splitter:
      type: length_splitter # kag.builder.component.splitter.length_splitter.LengthSplitter
      split_length: 4950
      window_length: 100
    vectorizer:
      type: batch_vectorizer # kag.builder.component.vectorizer.batch_vectorizer.BatchVectorizer
      vectorize_model: *vectorize_model
    writer:
      type: kg_writer # kag.builder.component.writer.kg_writer.KGWriter
  # ponytail: 4x4 = 16 request song song, dat tay cho account ChatGPT OAuth chu
  # khong do tu rate limit that. Cu 50x16 = 800 luong cua ban goc se dinh 429
  # ngay voi model (max). Thay bang con so do provider tra ve neu sau nay do duoc.
  num_threads_per_chain: 4
  num_chains: 4
  scanner:
    type: dir_file_scanner # kag.builder.component.scanner.directory_scanner.DirectoryScanner
    file_suffix: md
#------------kag-builder configuration end----------------#

#------------kag-solver configuration start----------------#
search_api: &search_api
  type: openspg_search_api #kag.solver.tools.search_api.impl.openspg_search_api.OpenSPGSearchAPI

graph_api: &graph_api
  type: openspg_graph_api #kag.solver.tools.graph_api.impl.openspg_graph_api.OpenSPGGraphApi

chain_vectorizer:
  type: batch
  vectorize_model: *vectorize_model

kg_cs: &kg_cs
  type: kg_cs_open_spg
  priority: 0
  path_select:
    type: exact_one_hop_select
    graph_api: *graph_api
    search_api: *search_api
  entity_linking:
    type: entity_linking
    graph_api: *graph_api
    search_api: *search_api
    recognition_threshold: 0.9
    exclude_types:
      - Chunk
      - AtomicQuery
      - KnowledgeUnit
      - Summary
      - Outline
      - Doc

kg_fr: &kg_fr
  type: kg_fr_open_spg
  top_k: 20
  graph_api: *graph_api
  search_api: *search_api
  vectorize_model: *vectorize_model
  path_select:
    type: fuzzy_one_hop_select
    llm_client: *openie_llm
    graph_api: *graph_api
    search_api: *search_api
  ppr_chunk_retriever_tool:
    type: ppr_chunk_retriever
    llm_client: *chat_llm
    graph_api: *graph_api
    search_api: *search_api
  entity_linking:
    type: entity_linking
    graph_api: *graph_api
    search_api: *search_api
    recognition_threshold: 0.8
    exclude_types:
      - Chunk
      - AtomicQuery
      - KnowledgeUnit
      - Summary
      - Outline
      - Doc

rc: &rc
  type: rc_open_spg
  vector_chunk_retriever:
    type: vector_chunk_retriever
    vectorize_model: *vectorize_model
    score_threshold: 0.65
    search_api: *search_api
  graph_api: *graph_api
  search_api: *search_api
  vectorize_model: *vectorize_model
  top_k: 20

kag_hybrid_executor: &kag_hybrid_executor_conf
  type: kag_hybrid_retrieval_executor
  retrievers:
    - *kg_cs
    - *kg_fr
    - *rc
  merger:
    type: kag_merger
  enable_summary:  true

kag_output_executor: &kag_output_executor_conf
  type: kag_output_executor
  llm_module: *chat_llm

kag_deduce_executor: &kag_deduce_executor_conf
  type: kag_deduce_executor
  llm_module: *chat_llm

py_code_based_math_executor: &py_code_based_math_executor_conf
  type: py_code_based_math_executor
  llm: *chat_llm


kag_solver_pipeline:
  type: kag_static_pipeline
  planner:
    type: lf_kag_static_planner
    llm: *chat_llm
    plan_prompt:
      type: legal_lf_static_planning
    rewrite_prompt:
      type: legal_rewrite_sub_task_query
  executors:
    - *kag_hybrid_executor_conf
    - *py_code_based_math_executor_conf
    - *kag_deduce_executor_conf
    - *kag_output_executor_conf
  generator:
    type: llm_index_generator
    llm_client: *chat_llm
    # Chỉ được đọc ở nhánh `if not self.enable_ref` (llm_index_generator.py:73).
    # Đang bật enable_ref nên dòng này KHÔNG chạy: prompt thật lấy qua biz_scene
    # thành legal_refer_generator_prompt / legal_without_refer_generator_prompt.
    # Vẫn trỏ vào bản không-ref để lỡ tắt enable_ref thì còn tiếng Việt, và vì
    # nhánh đó chỉ truyền content + query, không truyền ref.
    generated_prompt:
      type: legal_without_refer_generator_prompt
    enable_ref: true

#------------kag-solver configuration end----------------#
